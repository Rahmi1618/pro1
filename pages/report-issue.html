<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Issue - PharmaCare</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/pages.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-pills"></i>
                <span>PharmaCare</span>
            </div>
            <ul class="nav-menu">
                <li><a href="../index.html">Home</a></li>
                <li><a href="../components/medicines.html">Medicines</a></li>
                <li><a href="../components/pharmacies.html">Pharmacies</a></li>
                <li><a href="../components/orders.html">Orders</a></li>
                <li id="auth-menu">
                    <a href="../login.html">Login</a>
                </li>
            </ul>
        </div>
    </nav>

    <main>
        <section class="page-hero">
            <div class="hero-content">
                <h1><i class="fas fa-exclamation-triangle"></i> Report an Issue</h1>
                <p>Help us resolve problems quickly by reporting issues you encounter</p>
            </div>
        </section>

        <section class="report-section">
            <div class="container">
                <div class="contact-form">
                    <h2>Report a Problem</h2>
                    <p>Please provide as much detail as possible to help us understand and resolve the issue quickly.</p>
                    
                    <form id="report-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <input type="text" name="name" placeholder=" " required>
                                <label>Your Name *</label>
                            </div>
                            <div class="form-group">
                                <input type="email" name="email" placeholder=" " required>
                                <label>Email Address *</label>
                            </div>
                        </div>
                        
                        <div class="form-group full-width">
                            <select name="issueType" required>
                                <option value="">Select Issue Type</option>
                                <option value="technical">Technical Problem</option>
                                <option value="order">Order Issue</option>
                                <option value="payment">Payment Problem</option>
                                <option value="delivery">Delivery Issue</option>
                                <option value="pharmacy">Pharmacy Service</option>
                                <option value="prescription">Prescription Upload</option>
                                <option value="account">Account Access</option>
                                <option value="ai">AI Recommendations</option>
                                <option value="security">Security Concern</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        
                        <div class="form-group full-width">
                            <select name="priority">
                                <option value="low">Low Priority</option>
                                <option value="medium" selected>Medium Priority</option>
                                <option value="high">High Priority</option>
                                <option value="urgent">Urgent</option>
                            </select>
                        </div>
                        
                        <div class="form-group full-width">
                            <input type="text" name="orderNumber" placeholder=" ">
                            <label>Order Number (if applicable)</label>
                        </div>
                        
                        <div class="form-group full-width">
                            <textarea name="description" placeholder="Please describe the issue in detail, including steps to reproduce the problem..." required></textarea>
                        </div>
                        
                        <div class="form-group full-width">
                            <textarea name="expectedBehavior" placeholder="What did you expect to happen?"></textarea>
                        </div>
                        
                        <div class="form-group full-width">
                            <input type="text" name="deviceInfo" placeholder=" ">
                            <label>Device/Browser Information (e.g., Chrome on Android)</label>
                        </div>
                        
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-bug"></i> Submit Issue Report
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/app.js"></script>
    <script src="../js/pages.js"></script>
</body>
</html>
