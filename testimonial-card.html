<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Testimonial Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .testimonial-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 30px;
            max-width: 500px;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .testimonial-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
        }

        .testimonial-card.expanded {
            transform: scale(1.02);
        }

        .quote-icon {
            font-size: 48px;
            color: #667eea;
            opacity: 0.3;
            position: absolute;
            top: 20px;
            right: 30px;
        }

        .review-text {
            font-size: 18px;
            line-height: 1.6;
            color: #333;
            margin-bottom: 25px;
            font-style: italic;
            position: relative;
            z-index: 1;
        }

        .reviewer-info {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 18px;
        }

        .reviewer-details h4 {
            color: #333;
            font-size: 16px;
            margin-bottom: 4px;
        }

        .reviewer-details p {
            color: #666;
            font-size: 14px;
        }

        .extra-details {
            max-height: 0;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
            border-top: 1px solid #eee;
            padding-top: 0;
        }

        .extra-details.show {
            max-height: 200px;
            opacity: 1;
            padding-top: 20px;
            margin-top: 20px;
        }

        .detail-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 8px 0;
        }

        .detail-label {
            color: #666;
            font-weight: 500;
        }

        .detail-value {
            color: #333;
            font-weight: 600;
        }

        .rating {
            color: #ffc107;
        }

        .verified {
            color: #28a745;
            display: flex;
            align-items: center;
            gap: 5px;
        }
