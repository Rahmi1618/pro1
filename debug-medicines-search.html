<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Medicine Search</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/medicines.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <i class="fas fa-pills"></i>
                <span>PharmaCare - Debug</span>
            </div>
        </div>
    </nav>

    <main>
        <!-- Hero Section -->
        <section class="hero">
            <div class="hero-content">
                <h1>Debug Medicine Search</h1>
                <p>Testing search functionality with frontend data only</p>
                
                <!-- Search Container -->
                <div class="search-container">
                    <div class="search-wrapper">
                        <i class="fas fa-search search-icon"></i>
                        <input type="text" id="medicine-search" placeholder="Search for medicines, brands, or conditions..." autocomplete="off">
                        <button onclick="searchMedicine()" class="search-btn">
                            <span>Search</span>
                            <i class="fas fa-arrow-right"></i>
                        </button>
                    </div>
                    <div class="search-suggestions">
                        <span class="suggestion-tag" onclick="quickSearch('Paracetamol')">Paracetamol</span>
                        <span class="suggestion-tag" onclick="quickSearch('German')">German</span>
                        <span class="suggestion-tag" onclick="quickSearch('Antibiotic')">Antibiotic</span>
                        <span class="suggestion-tag" onclick="quickSearch('Ibuprofen')">Ibuprofen</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Medicine Results -->
        <section id="medicine-results" class="section">
            <div class="container">
                <div class="results-header">
                    <h2>Available Medicines</h2>
                    <div class="results-info">
                        <span id="results-count">Loading medicines...</span>
                    </div>
                </div>
                
                <!-- Debug Controls -->
                <div style="background: #f0f9ff; padding: 1rem; border-radius: 8px; margin-bottom: 2rem;">
                    <h4>Debug Controls:</h4>
                    <button onclick="testSearch('para')" class="btn btn-outline">Test "para"</button>
                    <button onclick="testSearch('german')" class="btn btn-outline">Test "german"</button>
                    <button onclick="testSearch('antibiotic')" class="btn btn-outline">Test "antibiotic"</button>
                    <button onclick="clearSearch()" class="btn btn-outline">Clear Search</button>
                    <button onclick="showAllMedicines()" class="btn btn-outline">Show All</button>
                </div>
                
                <div id="medicine-grid" class="medicine-grid"></div>
            </div>
        </section>
    </main>

    <script src="js/app.js"></script>
    <script src="js/medicines.js"></script>
    
    <script>
        // Debug functions
        function testSearch(query) {
            console.log('Testing search with:', query);
            const searchInput = document.getElementById('medicine-search');
            searchInput.value = query;
            performRealTimeSearch(query);
        }
        
        function showAllMedicines() {
            console.log('Showing all medicines');
            filteredMedicines = [...extendedMedicines];
            currentPage = 1;
            displayMedicines();
            
            const resultsCount = document.getElementById('results-count');
            if (resultsCount) {
                resultsCount.textContent = `Showing ${filteredMedicines.length} medicines`;
            }
            
            // Clear search input
            const searchInput = document.getElementById('medicine-search');
            if (searchInput) {
                searchInput.value = '';
            }
        }
        
        // Initialize page
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Debug page loaded');
            console.log('Total medicines available:', extendedMedicines.length);
            
            // List all medicine names for debugging
            console.log('Available medicines:');
            extendedMedicines.forEach((med, index) => {
                console.log(`${index + 1}. ${med.name} (${med.brand}) - ${med.production.country}`);
            });
            
            // Show all medicines initially
            showAllMedicines();
        });
    </script>
</body>
</html>
