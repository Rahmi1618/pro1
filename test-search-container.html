<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Search Container</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/medicines.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            padding: 2rem; 
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            min-height: 100vh;
        }
        .test-container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .hero-section {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            padding: 3rem 2rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            text-align: center;
        }
        .results-section {
            margin-top: 2rem;
        }
        #results-count {
            font-weight: bold;
            color: #2563eb;
            margin: 1rem 0;
            padding: 0.5rem 1rem;
            background: #f0f9ff;
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1 style="text-align: center; color: #2563eb; margin-bottom: 2rem;">
            <i class="fas fa-search"></i> Search Container Test
        </h1>
        
        <div class="hero-section">
            <h2>Medicine Search</h2>
            <p>Test the search container functionality</p>
            
            <!-- The exact search container from medicines.html -->
            <div class="search-container">
                <div class="search-wrapper">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="medicine-search" placeholder="Search for medicines, brands, or conditions..." autocomplete="off">
                    <button onclick="searchMedicine()" class="search-btn">
                        <span>Search</span>
                        <i class="fas fa-arrow-right"></i>
                    </button>
                </div>
                <div class="search-suggestions">
                    <span class="suggestion-tag" onclick="quickSearch('Paracetamol')">Paracetamol</span>
                    <span class="suggestion-tag" onclick="quickSearch('Amoxicillin')">Amoxicillin</span>
                    <span class="suggestion-tag" onclick="quickSearch('Ibuprofen')">Ibuprofen</span>
                    <span class="suggestion-tag" onclick="quickSearch('Vitamin C')">Vitamin C</span>
                    <span class="suggestion-tag" onclick="quickSearch('German')">German</span>
                    <span class="suggestion-tag" onclick="quickSearch('Ethiopian')">Ethiopian</span>
                </div>
            </div>
        </div>
        
        <div class="results-section">
            <h3>Test Results:</h3>
            <div id="results-count">Ready to search...</div>
            
            <!-- Test buttons -->
            <div style="margin: 1rem 0; display: flex; gap: 0.5rem; flex-wrap: wrap;">
                <button onclick="testSearch('para')" class="btn btn-outline">Test "para"</button>
                <button onclick="testSearch('german')" class="btn btn-outline">Test "german"</button>
                <button onclick="testSearch('antibiotic')" class="btn btn-outline">Test "antibiotic"</button>
                <button onclick="clearSearch()" class="btn btn-outline">Clear</button>
            </div>
            
            <div id="medicine-grid" class="medicine-grid"></div>
        </div>
        
        <!-- Debug info -->
        <div style="background: #f8fafc; padding: 1rem; border-radius: 8px; margin-top: 2rem; font-family: monospace; font-size: 0.9rem;">
            <h4>Debug Info:</h4>
            <div id="debug-info">Loading...</div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script src="js/medicines.js"></script>
    
    <script>
        function testSearch(query) {
            console.log('Testing search:', query);
            const input = document.getElementById('medicine-search');
            input.value = query;
            searchMedicine();
        }
        
        function updateDebugInfo() {
            const debugDiv = document.getElementById('debug-info');
            debugDiv.innerHTML = `
                <div>✅ Medicines loaded: ${extendedMedicines ? extendedMedicines.length : 'Not loaded'}</div>
                <div>✅ Search function: ${typeof searchMedicine === 'function' ? 'Available' : 'Missing'}</div>
                <div>✅ QuickSearch function: ${typeof quickSearch === 'function' ? 'Available' : 'Missing'}</div>
                <div>✅ Search input: ${document.getElementById('medicine-search') ? 'Found' : 'Missing'}</div>
                <div>✅ Search icon: ${document.querySelector('.search-icon') ? 'Found' : 'Missing'}</div>
                <div>✅ Search button: ${document.querySelector('.search-btn') ? 'Found' : 'Missing'}</div>
                <div>✅ Suggestion tags: ${document.querySelectorAll('.suggestion-tag').length} found</div>
            `;
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('Test page loaded');
            
            // Initialize medicines
            if (typeof extendedMedicines !== 'undefined') {
                filteredMedicines = [...extendedMedicines];
                displayMedicines();
                
                const resultsCount = document.getElementById('results-count');
                if (resultsCount) {
                    resultsCount.textContent = `${filteredMedicines.length} medicines available`;
                }
            }
            
            updateDebugInfo();
            
            // Test suggestion tag clicks
            document.querySelectorAll('.suggestion-tag').forEach(tag => {
                tag.addEventListener('click', function() {
                    console.log('Suggestion tag clicked:', this.textContent);
                });
            });
        });
    </script>
</body>
</html>
